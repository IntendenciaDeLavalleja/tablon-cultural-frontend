name: Validate release
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y libmagic1
      - run: pip install -r backend/requirements.txt pip-audit
      - run: python -m pytest -q
      - run: pip-audit -r backend/requirements.txt
      - run: npm ci
      - run: npm audit
      - run: npm run check && npm test && npm run build:admin
      - run: python tests/integration/setup_qa.py
      - run: docker compose --env-file .env.test -p tablon-qa -f compose.yaml -f deploy/compose.test.yaml up -d --build --wait --wait-timeout 180
      - run: docker compose --env-file .env.test -p tablon-qa -f compose.yaml -f deploy/compose.test.yaml exec -T backend flask create-admin qa qa@example.com 'QA-only-Password-123!' true
      - run: python tests/integration/migrations.py
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e
      - run: python tests/integration/recovery.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: playwright-report/
      - if: always()
        run: docker compose --env-file .env.test -p tablon-qa -f compose.yaml -f deploy/compose.test.yaml down
